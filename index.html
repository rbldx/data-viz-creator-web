        // 格式化日期显示
        function formatDate(dateStr) {
            if (!dateStr) return dateStr;
            
            // 尝试解析各种日期格式
            const formats = [
                /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/,      // YYYY-MM-DD 或 YYYY/MM/DD
                /^(\d{4})(\d{2})(\d{2})$/,                 // YYYYMMDD
                /^(\d{4})年(\d{1,2})月(\d{1,2})日$/,       // 中文格式
                /^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/,      // MM-DD-YYYY 或 DD/MM/YYYY
                /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})\s+\d{2}:\d{2}(:\d{2})?$/ // 带时间
            ];
            
            for (const format of formats) {
                const match = String(dateStr).match(format);
                if (match) {
                    if (match[3].length === 4) {
                        // MM-DD-YYYY 格式
                        return `${match[3]}-${match[1].padStart(2, '0')}-${match[2].padStart(2, '0')}`;
                    } else {
                        // YYYY-MM-DD 格式
                        return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
                    }
                }
            }
            
            // 如果都不匹配，尝试用Date对象解析
            const date = new Date(dateStr);
            if (!isNaN(date.getTime())) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }
            
            return dateStr;
        }
        
        // 获取月份显示格式
        function getMonthDisplay(dateStr) {
            const date = new Date(dateStr);
            if (!isNaN(date.getTime())) {
                // 返回格式：YYYY/MM
                return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}`;
            }
            return dateStr;
        }
        
        // 转换Excel日期序列号为可读日期
        function convertExcelDate(excelDate) {
            if (!excelDate) return '';
            
            // 如果已经是字符串形式的日期，直接返回
            if (typeof excelDate === 'string') {
                // 尝试解析各种日期格式
                const formats = [
                    /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/,      // YYYY-MM-DD 或 YYYY/MM/DD
                    /^(\d{4})(\d{2})(\d{2})$/,                 // YYYYMMDD
                    /^(\d{4})年(\d{1,2})月(\d{1,2})日?$/,      // 中文格式
                    /^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/,      // MM-DD-YYYY 或 DD/MM/YYYY
                    /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})\s+\d{2}:\d{2}(:\d{2})?$/ // 带时间
                ];
                
                for (const format of formats) {
                    const match = excelDate.match(format);
                    if (match) {
                        if (match[3].length === 4) {
                            // MM-DD-YYYY 格式
                            return `${match[3]}/${String(match[1]).padStart(2, '0')}`;
                        } else {
                            // YYYY-MM-DD 格式
                            return `${match[1]}/${String(match[2]).padStart(2, '0')}`;
                        }
                    }
                }
                
                // 如果是文本格式的年月，直接返回
                const monthMatch = excelDate.match(/^(\d{4})[/年](\d{1,2})/);
                if (monthMatch) {
                    return `${monthMatch[1]}/${String(monthMatch[2]).padStart(2, '0')}`;
                }
                
                // 尝试用Date对象解析
                const date = new Date(excelDate);
                if (!isNaN(date.getTime())) {
                    return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}`;
                }
                
                return excelDate;
            }
            
            // Excel日期序列号处理
            if (typeof excelDate === 'number') {
                // Excel使用1900年1月1日作为基准日期
                // 但存在1900年不是闰年的bug，Excel认为是闰年
                const excelEpoch = new Date('1899-12-30'); // 调整后的基准日期
                const millisecondsPerDay = 24 * 60 * 60 * 1000;
                
                // 处理小数部分（时间）
                const days = Math.floor(excelDate);
                const date = new Date(excelEpoch.getTime() + days * millisecondsPerDay);
                
                // 返回格式：YYYY/MM
                return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}`;
            }
            
            return String(excelDate);
        }
    </script>
</body>
